# **自動で merge するのは security update だけ。**
# minor / patch を全部自動で入れると、cooldown をすり抜けた攻撃版を
# そのまま取り込みかねない。advisory (GHSA) が紐づいた PR だけを通す。
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  # ghsa-id を引くのに要る (alert-lookup)。
  security-events: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: meta
        with:
          alert-lookup: true
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - if: steps.meta.outputs.ghsa-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL" -b "Auto-approving security update." && gh pr merge --auto --squash "$PR_URL"
