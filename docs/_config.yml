# GitHub Pages（このフォルダを公開サイトとして配信する）の設定。
#
# Windows ストアの申請フォームで「プライバシーポリシーの URL」を求められるための
# 公開先でもある（docs/release.md の「3.5. 公開するページ」参照）。
#
# **2026-09-24 から独自ドメイン https://lo.ldas.jp で出している**（docs/CNAME）。
# DNS は Cloudflare の ldas.jp に CNAME lo → nakamura196.github.io（プロキシなし。
# プロキシを通すと GitHub が HTTPS の証明書を取れない）。
# 旧 URL（nakamura196.github.io/local-ocr/…）は GitHub が新 URL へ転送する。
# ストアの掲載情報は旧 URL のプライバシーポリシーを指しているので、CNAME を外すと
# その転送が止まって切れる。独自ドメインをやめるときは、先にそちらを差し替えること。
#
# 見た目は guide-theme（https://github.com/nakamura196/guide-theme）。
# _layouts/guide.html はそこから写したもの。直すときはテーマ側で版を上げてから写す。
title: Local OCR
description: 画像の文字を、手元のパソコンの中だけで読み取るアプリです（macOS・Windows）。
theme: jekyll-theme-minimal

# 左上のアイコンと、共有したときに出る画像（OGP）。
# 英語のページは front matter の image で ogp-en.png に差し替える。
# OGP 画像は scripts/docs/make_ogp.py で作る。
guide_theme:
  logo: /assets/icon.png
  image: /assets/ogp/ogp-ja.png

# すべてのページを guide-theme で出す。各ページの front matter で上書きできる。
defaults:
  - scope: { path: "" }
    values:
      layout: guide
      lang: ja
      footer: "お問い合わせ / Contact: nakamura@hi.u-tokyo.ac.jp"
      nav:
        - { title: トップ, url: ./ }
        - { title: 使い方, url: guide.html }
        - { title: GitHub, url: "https://github.com/nakamura196/local-ocr" }
